# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
tone_instructions: "Direct, no filler, no praise."

reviews:
  profile: assertive

  auto_review:
    # CodeRabbit cannot filter by head branch, so automated pull requests are
    # skipped by author: Renovate opens `renovate/*`, the release manager app
    # opens `release-please--*`. Both the bot login and the bare app slug are
    # listed because the match is exact.
    ignore_usernames:
      - "renovate[bot]"
      - "renovate"
      - "automatic-release-manager[bot]"
      - "automatic-release-manager"

  # Generated, tool-owned or bulk data files. Review their sources instead.
  path_filters:
    - "!**/Cargo.lock"
    - "!**/package-lock.json"
    - "!target/**"
    - "!CHANGELOG.md"
    - "!.release-please-manifest.json"
    - "!README.md" # rendered from .github/templates/README.md.hbs
    - "!docs/CONFIGURATION.md" # rendered from .github/templates/CONFIGURATION.md.hbs
    - "!docs/config.contract.json" # written by `just regenerate` from crates/config
    - "!data/**" # raw statistics dumps, converter input
    - "!data-test/**" # test fixtures in the same format

  path_instructions:
    - path: "{crates,apps}/**/*.rs"
      instructions: |
        Internal workspace crates (not published); no semver promise. Flag:
        - `unwrap`, `expect`, `panic!`, `unreachable!` or panicking indexing in non-test code.
        - Byte-index string slicing (`s[..n]`) on input that may be non-ASCII or shorter than `n`.
        - Missing rustdoc, `# Errors` / `# Panics` sections (`missing_docs` is on).
        - New `#[allow(...)]`; prefer `#[expect(..., reason = "...")]`.
        - New workspace dependencies or features without justification.
        Rust is pinned in rust-toolchain.toml; there is no MSRV.
    - path: "crates/core/**"
      instructions: |
        Defines the sharded on-disk format and routes shared by converter, server and frontend.
        Any change to a model, shard key or path layout must be applied on both the writing and the
        reading side in the same PR and must not silently misread data produced by the previous
        release.
    - path: "crates/common/**"
      instructions: |
        Compression and sharding helpers. Decompression must be bounded (size limits, no
        decompression bombs), shard functions must not panic on short or non-ASCII input, and
        error types must carry enough context to locate the failing file.
    - path: "crates/config/**"
      instructions: |
        Layered configuration via terrace-config, including CSP. Secrets must be `secrecy` types and
        never logged or serialised in clear. A renamed or removed key is a breaking change for
        operators and requires a regenerated contract and CONFIGURATION.md template update.
    - path: "apps/converter/**"
      instructions: |
        Offline batch converter from data/ to the sharded tree. Treat archive and JSON input as
        untrusted: tar entries must not escape the output directory, sizes must be bounded, and
        malformed records must be reported, not panic. Output must be deterministic; check that
        the conversion cache fingerprint covers every input that changes the output, and that rayon
        parallelism does not race on shared files.
    - path: "apps/server/**"
      instructions: |
        Axum static file server for the built frontend and data tree. Check path traversal and
        symlink exposure via `ServeDir`, CSP and security headers, cache headers on immutable vs
        mutable assets, that startup checks fail closed, that Sentry receives no PII, and that no
        blocking work runs on the async runtime.
    - path: "apps/frontend/**/*.rs"
      instructions: |
        Dioxus web client compiled to wasm. A panic kills the whole app: handle fetch and decode
        failures with user-visible error states. Player names and other data are untrusted: no
        `dangerous_inner_html`. Watch for re-render loops, unnecessary clones of large datasets, and
        dependencies that bloat the wasm bundle.
    - path: "apps/frontend/{package.json,scripts/**}"
      instructions: |
        Build-time asset tooling only. New npm dependencies need justification; scripts must not
        fetch from the network or write outside the frontend directory.
    - path: "deploy/config.toml"
      instructions: |
        Configuration baked into the image. No secrets, no host-specific values; paths must match
        the Dockerfile layout.
    - path: "{Dockerfile,cst.yaml}"
      instructions: |
        Base images pinned by digest, runtime stays minimal and non-root, builds use `--locked`, no
        secrets in layers or build args. cst.yaml must agree with the Dockerfile.
    - path: ".github/workflows/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with a version comment.
        Require least-privilege `permissions:` at workflow or job level, `persist-credentials: false`
        on checkout unless pushing, no untrusted `${{ github.event.* }}` interpolation into `run:`,
        and no `pull_request_target` that checks out or executes PR code.
    - path: ".github/templates/**"
      instructions: |
        Sources of the generated README.md and docs/CONFIGURATION.md. Review rendered wording, links
        and badge URLs here.
    - path: "**/*.sh"
      instructions: |
        Require `set -euo pipefail`, quoted expansions, and no reliance on GNU-only flags
        without a comment.

  pre_merge_checks:
    title:
      mode: error
      requirements: |
        Must follow Conventional Commits: `type(scope)?!?: subject`. Allowed types: feat, fix, perf,
        revert, docs, refactor, test, style, ci, build, chore, deps. Lowercase, imperative subject,
        no trailing period. release-please derives version bumps and the changelog from this title.

  tools:
    # Already enforced in CI; duplicating it adds noise.
    clippy:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    markdownlint:
      enabled: true
