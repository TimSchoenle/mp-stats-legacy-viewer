name: Update Files

on:
  pull_request:

# A newer push supersedes the run on the older head. Nothing here writes to the branch: the
# commit happens in update-files-commit.yml, which queues with the other writers to this branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  # The lock-file sync comes in two halves, and the split is the security boundary of this
  # workflow.
  #
  # `cargo fetch` runs code the pull request controls: the toolchain `rust-toolchain.toml` names,
  # and whatever that toolchain's cargo does with the manifests. So the half that runs it holds no
  # secret and a read-only `GITHUB_TOKEN`, and hands on only data: the changed `Cargo.lock`, as a
  # patch artifact.
  #
  # The second half, `update-lock-file` in update-files-commit.yml, runs from the default branch's
  # copy and holds the maintenance App's private key and the write token minted from it,
  # and runs nothing from the checkout: `common/commit-patch` refuses any path but `Cargo.lock`
  # and commits the rest. Were both halves one job, anything the first ran could read the key out
  # of the runner's memory or leave a process behind to collect the token once it was minted - a
  # compromised toolchain or crate arriving in a Renovate pull request would be enough.
  generate-lock-file:
    name: Sync Cargo.lock with Cargo.toml
    # A fork's branch is not in this repository, so there would be nothing to commit to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The pull request head commit, not the merge commit and not the branch name: the patch is
      # committed to the branch, and `update-lock-file` in update-files-commit.yml (a workflow_run
      # workflow the pull request cannot edit) applies it to exactly this commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Sync Cargo.lock with Cargo.toml
        run: cargo fetch

      - name: Hand the lock file on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: cargo-lock
          paths: Cargo.lock
