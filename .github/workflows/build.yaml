name: Build

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # `cargo check` alone never touches `--locked`, so a `Cargo.toml` edit that needs a
      # matching `Cargo.lock` update can pass here and every other fast job, then only fail deep
      # inside the multi-stage Docker build - `contract-builder` is the only place that runs
      # `cargo` with `--locked` - after several minutes of otherwise-unrelated compilation. This
      # is the cheap equivalent that fails in seconds instead.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Verify Cargo.lock is up to date
        run: cargo update --workspace --locked

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7

  # The `LABEL` region in the Dockerfile, against the contract it claims to point at.
  #
  # The region is hand-carried, because a `LABEL` key cannot be interpolated from a generator, so
  # it can be wrong in ways nothing else here would notice. This catches a prefix change one step
  # before the image is built; the check on the built image in `Docker Build and Test` catches
  # what a source diff cannot see at all.
  #
  # The committed `docs/config.contract.json` is *not* checked here. It carries `app.version` out
  # of `Cargo.toml`, so a release pull request bumping the version makes it stale through no
  # change to the configuration at all - and a gate that only the release bot can trip, and cannot
  # itself clear, blocks every release. `docs.yml` regenerates and commits it instead, beside
  # `config.example.toml`, and verifies it wherever it cannot commit.
  contract:
    name: Config Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # The generator renders the region and the action diffs it, cut at the
      # `terrace-config:labels` markers rather than by line count: the `grep -A2` this step used
      # to do reads correctly right up until a fourth label is added, and then compares two of
      # three lines and passes.
      #
      # `contract` is emptied for the reason the job comment gives, and `image` because there is
      # no image on this runner - which is what makes this the cheap half, running on every pull
      # request without waiting for a build.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          package: mp-stats-config
          features: config-schema
          contract: ''
          image: ''

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  # Kept apart from `test`, so a Codecov outage fails this job alone. The upload authenticates
  # with this job's OIDC token, so the job needs no environment and no secret.
  # `.github/codecov.yml` decides what the Codecov statuses check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The arguments `test` runs with, which are the rust/test action's defaults. No crate embeds
      # the built frontend, so the tests need no Node step first.
      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@81e4009704e0963651bbd8275e31244c1d1e220d # tag=actions-rust-coverage-codecov-v2.0.3
        with:
          test_arguments: '--all-features --workspace'
          flags: rust

  # Auto-format is split in two. `cargo fmt` honours the pull request's own `rust-toolchain.toml`
  # and `rustfmt.toml`, so this job runs code the pull request chose and holds no secret, no
  # environment and no write permission; it uploads what `cargo fmt` changed as a patch artifact.
  # `fmt-commit` below holds the App token and commits that patch, running no repository code.
  #
  # Pull requests only: a push to `main` has no pull request head to commit to.
  fmt:
    name: Auto Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    outputs:
      changes_detected: ${{ steps.format.outputs.changes_detected }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-rust-auto-format-v2.0.0
        with:
          artifact_name: rust-auto-format

  fmt-commit:
    name: Commit Format
    needs: fmt
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' && needs.fmt.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only this job,
    # which runs no repository code, gets it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to fetch the commit the patch applies to; the write uses the App token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # An App installation token, so the commit is verified and re-triggers the checks on the
      # branch it lands on. Scoped to the one permission the commit needs.
      - name: Generate Bot Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the formatted files

      # `artifact_name` is spelled out rather than read from the format job's output, which a job
      # running pull request code produced. `allowed_paths` admits only Rust
      # sources, the only files `cargo fmt` rewrites; any other path fails this job and nothing is committed.
      - name: Commit Format
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.token.outputs.token }}
          artifact_name: rust-auto-format
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The action's default arguments lack `--workspace`, which lints the placeholder root package
      # and none of the members. `-D warnings` is what makes a finding fail the required check
      # rather than only annotate the diff. Keep in step with `just lint`.
      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13
        with:
          clippy_arguments: '--workspace --all-features --all-targets -- -D warnings'

  # The half of the documentation standard a linter can hold. `missing_docs` and the rustdoc lint
  # tables are declared on the workspace and inherited by every member, but rustdoc's own lints
  # never run under `cargo check` or `cargo clippy`, so without this job an undocumented `pub fn`
  # and a broken intra-doc link both merge green.
  #
  # What it cannot catch is a comment that restates its signature. That one is a review criterion,
  # and pretending otherwise would produce comments written to pass a linter.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # `--no-deps`, because the only crates whose documentation this gate is about are the ones in
      # this workspace, and a dependency's warnings are not ours to fix.
      - name: Render the documentation
        run: cargo doc --workspace --all-features --no-deps

      # `mp-stats-config`'s `config-schema` feature changes which items exist, so the run above is
      # the only one that renders them. This one proves the crate still documents cleanly without
      # it, which is how it is actually built.
      - name: Render it again without the schema feature
        run: cargo doc --workspace --no-deps

      - name: Run the doctests
        run: cargo test --doc --workspace --all-features

  docker-build-test:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    # `doc` as well as `check`, so a documentation failure stops the merge rather than going red on
    # `main` and staying there. It costs a minute in front of a build that takes many.
    needs: [ check, doc ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No QEMU setup on purpose: the Dockerfile cross-compiles every artifact
      # from the runner's native architecture. Should a target-architecture
      # command ever sneak into the build, it must fail loudly rather than fall
      # back to (very slow) emulation.
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # BuildKit does not persist `RUN --mount=type=cache` mounts in the GitHub
      # Actions cache (only image layers are stored via `type=gha`). The
      # converter's incremental cache lives in such a mount, so we restore it
      # into a host directory and inject it into the build, then extract and
      # save it again afterwards (the extraction runs in the cache-dance post
      # step, and `actions/cache` persists the host directory between runs).
      #
      # zizmor reports this cache as a poisoning path because the same job runs
      # docker/build-push-action, and the layers it writes to `type=gha` are
      # read by the release build. The entry `main` restores can only be
      # written by a run on `main`: this workflow has no `pull_request_target`
      # trigger, and a pull request run saves into its own ref's scope, which
      # `main` never reads.
      - name: Restore converter data cache
        id: converter-cache # zizmor: ignore[cache-poisoning] -- only runs on main write the entry main restores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: converter-cache
          key: converter-cache-${{ hashFiles('data-test/**') }}
          restore-keys: |
            converter-cache-

      - name: Inject converter cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "converter-cache": {
                "target": "/app/.converter_cache",
                "id": "converter-cache"
              }
            }
          skip-extraction: ${{ steps.converter-cache.outputs.cache-hit }}

      # One cache scope per platform. A `type=gha` export replaces the index of its scope, so with
      # one shared scope the arm64 export dropped the amd64-only layers from the index the amd64
      # build had just written, and the next amd64 build found none of them; the amd64 export did
      # the same to arm64 on the following run. A re-run of an unchanged `main` commit compiled
      # the server's 187 dependencies again on both platforms, about 95 s each. Layers both
      # platforms share are stored once either way: blobs are keyed by digest.
      #
      # Every build reads the cache; only a push to `main` writes it. A pull request's export
      # lands in its own ref, which `main` never reads, but counts against the repository's 10 GB
      # Actions cache, and GitHub makes room by evicting the least recently used entries, `main`'s
      # among them. A pull request that changes the lockfile or the build stages cooks again on
      # each of its pushes.
      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: image:test
          build-args: |
            DATA_INPUT_DIRECTORY=data-test
            version=test
            release=test
            vendor=Tim Schönle
            VERSION=test
          cache-from: type=gha,scope=amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=amd64' || '' }}

      # `load: true` cannot export a multi-platform *index*, but it exports a
      # single-platform image of any architecture perfectly well - the daemon
      # only refuses to run one, and nothing here runs it. Loading the arm64
      # variant instead of discarding it is what lets its labels be read: they
      # live in each platform's own config blob, so a build argument or a
      # differing base can make one architecture carry them and another not, and
      # only inspecting both can see that.
      #
      # The architecture-independent stages (frontend, data conversion, the
      # contract) are reused from the amd64 build above, so only the server
      # binary and its dependencies are actually recompiled.
      - name: Build Docker image (linux/arm64 cross-compile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: image:test-arm64
          build-args: |
            DATA_INPUT_DIRECTORY=data-test
            version=test
            release=test
            vendor=Tim Schönle
            VERSION=test
          cache-from: type=gha,scope=arm64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=arm64' || '' }}

      # The document and the labels the two builds above put in their images, on
      # the host where they can be compared against them. One export of the
      # `contract-export` stage rather than a second full build: everything it
      # needs is already in the cache the amd64 build just wrote.
      - name: Export the generated contract and labels
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          target: contract-export
          outputs: type=local,dest=contract-out
          build-args: |
            DATA_INPUT_DIRECTORY=data-test
            version=test
            release=test
            vendor=Tim Schönle
            VERSION=test
          cache-from: type=gha,scope=amd64

      # The check the hand-written `LABEL` region needs and that no source diff
      # can give: the action renders the labels from the configuration types
      # itself and compares them with what the image's own config blob carries.
      #
      # The toolchain is here rather than at the top of the job because only the
      # two steps below need it, and `cache: false` because this job builds
      # images: a restored cache is writable by any branch, and caching in a job
      # that produces a runtime artefact is the cache-poisoning path zizmor
      # flags. The only thing compiled is the contract generator, so there is
      # nearly nothing to save.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      # One step per platform, because the action inspects one image and the
      # labels live in each manifest's own config blob - a build argument or a
      # differing base can leave one architecture carrying them and another not,
      # and only inspecting both can see that. A failure on amd64 now hides
      # arm64 until the next run, which the loop this replaced did not; the
      # trade is one implementation of the check instead of six.
      #
      # `dockerfile` and `contract` are emptied: the `Config Contract` job above
      # owns both, and repeating them here would report the same drift twice.
      - name: Verify the linux/amd64 image carries the contract labels
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          package: mp-stats-config
          features: config-schema
          dockerfile: ''
          contract: ''
          image: image:test

      - name: Verify the linux/arm64 image carries the contract labels
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          package: mp-stats-config
          features: config-schema
          dockerfile: ''
          contract: ''
          image: image:test-arm64

      # The cross-check the dropped hash label would have bought, and the build
      # is the one place that gets it for free because it holds both copies. A
      # stale in-image document is exactly the failure nothing downstream can
      # see: the chart repository fetches the registry copy, and would compare
      # it against this one only if the image were pulled apart layer by layer.
      #
      # `FROM scratch` has no shell, but `docker cp` needs none - it reads the
      # container's filesystem from the daemon, and the container is created and
      # never started.
      - name: Compare the contract inside the image with the exported copy
        run: |
          set -euo pipefail
          trap 'docker rm -f contract-probe >/dev/null 2>&1 || true' EXIT
          status=0
          for entry in 'image:test linux/amd64' 'image:test-arm64 linux/arm64'; do
            set -- ${entry}
            docker rm -f contract-probe >/dev/null 2>&1 || true
            docker create --platform "$2" --name contract-probe "$1" >/dev/null
            docker cp contract-probe:/config/contract.json "${RUNNER_TEMP}/from-image.json"
            if ! cmp "${RUNNER_TEMP}/from-image.json" contract-out/out/contract.json; then
              echo "::error::$1 ($2) carries a /config/contract.json that is not the document this build generated, so the image and its contract came from different builds" >&2
              status=1
            fi
          done
          exit "${status}"

      # The server takes no arguments - it reads the `/config.toml` the image bakes in - so it
      # cannot be smoke-tested by passing it a flag: an unknown argument is ignored, the server
      # starts, and `docker run` never returns. Booting it and asking it for a page is both the
      # thing that terminates and the stronger check, since it fails when the configuration
      # does not resolve to the layout inside the image.
      - name: Test Docker image runs
        run: |
          set -euo pipefail
          # No `--rm`: a container that died on boot has to survive long enough to be asked why.
          docker run -d --name smoke -p 8080:8080 image:test
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 30); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null; then
              # `/` is served by the SPA fallback out of `server.dist_dir`, so this fails if the
              # baked configuration points anywhere other than where the image put the frontend.
              curl -fsS http://localhost:8080/ >/dev/null
              echo "container booted and is serving"
              exit 0
            fi
            sleep 1
          done

          echo "::error::the container did not become ready within 30s"
          docker logs smoke || true
          exit 1

      - name: Run structure tests
        run: |
          docker pull gcr.io/gcp-runtimes/container-structure-test:latest
          docker run --rm \
            -v $PWD/cst.yaml:/cst.yaml \
            -v /var/run/docker.sock:/var/run/docker.sock \
            gcr.io/gcp-runtimes/container-structure-test:latest test \
            --image image:test --config /cst.yaml

      # Size warning, Trivy scan, SARIF upload and the pull request comment in one step, on the
      # amd64 image only - the one the inline steps this replaced measured and scanned. The arm64
      # image above is loaded for its labels, not checked here.
      #
      # No `platform`, on purpose: without one the SARIF goes up under upload-sarif's default
      # category, which is where the existing alerts live, and the comment keeps the
      # `docker-image-size` identifier, so an open pull request has its comment updated rather
      # than a second one posted beside it. The 150 MiB warning and the `CRITICAL,HIGH` filter are
      # the action's defaults.
      - name: Check image size and vulnerabilities
        uses: TimSchoenle/actions/actions/docker/image-check@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-docker-image-check-v1.1.7
        with:
          image: image:test

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
