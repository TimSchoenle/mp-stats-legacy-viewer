name: Docs

# `README.md`, `docs/CONFIGURATION.md` and `config.example.toml` are generated. This workflow is
# what makes that claim true in both directions.
#
# On a pull request it regenerates all three and commits what changed back to the branch, so no
# key, default or environment spelling in the documentation is ever typed by hand: the commit
# that adds a configuration key is the commit its documentation arrives with. The same holds for
# the two pinned dependency tags the pages quote, which is what keeps a Renovate bump from
# leaving the README advertising a version this repository no longer builds against.
#
# Everywhere it cannot commit - a push to `main`, a pull request from a fork - it verifies
# instead, writing nothing and failing when a committed file is stale. Without that, editing
# `README.md` directly would appear to work right up until the next pull request silently
# reverted it.

on:
  pull_request:
  push:
    branches: [ main ]

# Shared with update-files.yaml rather than scoped to this workflow: both commit to the pull
# request branch, and the API call that makes a verified commit rejects one whose parent has
# moved. Two writers racing would leave one of them failing for no reason a reader could act on,
# so they queue instead. `cancel-in-progress: false` for the same reason - a cancelled run here
# means a branch left holding half of a regeneration.
concurrency:
  group: branch-writes-${{ github.ref }}
  cancel-in-progress: false

permissions: { }

jobs:
  render:
    name: Render
    # Forks get no secrets, so the App token would be empty and the commit could not be pushed to
    # their branch anyway. `verify` below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the write happens with the App token below, not with GITHUB_TOKEN
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # An App installation token, so the commit is verified and - unlike one made with
      # `GITHUB_TOKEN` - re-triggers the checks on the branch it lands on.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write

      # The head of the branch, not the merge commit: the render has to read the `Cargo.toml` and
      # the structs the pull request proposes, and the commit has to land on top of what is there
      # now.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # `just` rather than a script under `.github/scripts/`, so that the command a README
      # quotes, the command CI runs and the command a developer types are one string.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Regenerate everything the configuration types own
        run: just regenerate

      # The two pinned dependency tags, straight out of `Cargo.toml`. They are the only scalars
      # this repository still has to produce itself: the name, the description, the licence, the
      # release tag, the edition and the documentation index are all derived from the manifest
      # and from `docs/` by the action below, and merged with these.
      - name: Generate the dependency-tag payload
        id: config
        run: |
          set -euo pipefail
          json="$(just docs-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` is pinned rather than left to its default. That default is `github.ref_name`,
      # which on a `pull_request` event is `<number>/merge`, so `render` would write that into
      # every badge and permanent link while `verify` on `main` wrote `main` - a drift failure on
      # the merge commit with nothing in the diff to explain it.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-readme-variables-v1.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Render and commit the README
        id: readme
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@0406974974a3aaf884e7c65866b091d266614b46 # tag=actions-common-render-template-and-commit-v1.1.5
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: 'docs: render README from template'

      - name: Render and commit the configuration reference
        id: reference
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@0406974974a3aaf884e7c65866b091d266614b46 # tag=actions-common-render-template-and-commit-v1.1.5
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: 'docs: render configuration reference from template'

      # Not renders: nothing templates either of them, so both are committed straight from the
      # generator's output. `file_pattern` keeps this commit to those two files - the partials the
      # two steps above rendered from live under `target/`, but a dirty working tree must not ride
      # along in a documentation commit.
      #
      # The contract is here rather than behind a `git diff` gate because it carries the version
      # out of `Cargo.toml`, and a release pull request bumps that without regenerating anything.
      # A gate turned every release into a red check that the release bot could not clear on its
      # own; regenerating and committing it puts the new version on the same branch that raised
      # it, and a configuration change still arrives as a reviewable diff in the pull request
      # that caused it. `verify` below is what keeps that true where nothing can be committed.
      #
      # The Dockerfile is in the pattern because its `LABEL` region is part of the contract:
      # `just regenerate` rewrites it between the `terrace-config:labels` markers, and a region
      # left uncommitted here is one the `Config Contract` job would fail on for a drift this
      # job had already fixed in the working tree and thrown away.
      - name: Commit the example configuration and the contract
        id: example
        uses: TimSchoenle/actions/actions/common/commit-changes@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-commit-changes-v1.4.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: 'docs: regenerate config.example.toml and the config contract'
          file_pattern: 'config.example.toml docs/config.contract.json Dockerfile'

      - name: Summarise
        env:
          README: ${{ steps.readme.outputs.changes_detected }}
          REFERENCE: ${{ steps.reference.outputs.changes_detected }}
          EXAMPLE: ${{ steps.example.outputs.changes_detected }}
        run: |
          regenerated=""
          if [ "${README}" = "true" ]; then regenerated="${regenerated} README.md"; fi
          if [ "${REFERENCE}" = "true" ]; then regenerated="${regenerated} docs/CONFIGURATION.md"; fi
          if [ "${EXAMPLE}" = "true" ]; then regenerated="${regenerated} config.example.toml docs/config.contract.json Dockerfile"; fi

          if [ -n "${regenerated}" ]; then
            echo "Regenerated and committed:${regenerated}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Every generated file already matched its source." >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: Docs are current
    # The complement of `render`: it covers the pushes to `main` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Regenerate everything the configuration types own
        run: just regenerate

      # The two pinned dependency tags, straight out of `Cargo.toml`. They are the only scalars
      # this repository still has to produce itself: the name, the description, the licence, the
      # release tag, the edition and the documentation index are all derived from the manifest
      # and from `docs/` by the action below, and merged with these.
      - name: Generate the dependency-tag payload
        id: config
        run: |
          set -euo pipefail
          json="$(just docs-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` is pinned rather than left to its default. That default is `github.ref_name`,
      # which on a `pull_request` event is `<number>/merge`, so `render` would write that into
      # every badge and permanent link while `verify` on `main` wrote `main` - a drift failure on
      # the merge commit with nothing in the diff to explain it.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-readme-variables-v1.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when the committed file is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-render-template-v1.1.2
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify docs/CONFIGURATION.md is current
        uses: TimSchoenle/actions/actions/common/render-template@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-render-template-v1.1.2
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      # `just regenerate` wrote over all three committed copies in the step above, so the diff
      # is the check. All at once rather than one step each: a branch that regenerated none of
      # them should be told about all three rather than about whichever came first.
      #
      # Not the `config-contract` action, although it would check two of these: it does not
      # know about `config.example.toml`, so this job would still need the diff and would then
      # be reporting the same drift from two places.
      - name: Verify config.example.toml, the contract and the LABEL region are current
        run: git diff --exit-code -- config.example.toml docs/config.contract.json Dockerfile
