name: Docs

# `README.md`, `docs/CONFIGURATION.md` and `config.example.toml` are generated. This workflow is
# what makes that claim true in both directions.
#
# On a pull request it regenerates all three and commits what changed back to the branch, so no
# key, default or environment spelling in the documentation is ever typed by hand: the commit
# that adds a configuration key is the commit its documentation arrives with. The same holds for
# the two pinned dependency tags the pages quote, which is what keeps a Renovate bump from
# leaving the README advertising a version this repository no longer builds against.
#
# Everywhere it cannot commit - a push to `main`, a pull request from a fork - it verifies
# instead, writing nothing and failing when a committed file is stale. Without that, editing
# `README.md` directly would appear to work right up until the next pull request silently
# reverted it.

on:
  pull_request:
  push:
    branches: [ main ]

# Shared with update-files.yml rather than scoped to this workflow: both commit to the pull
# request branch, and the API call that makes a verified commit rejects one whose parent has
# moved. Two writers racing would leave one of them failing for no reason a reader could act on,
# so they queue instead. `cancel-in-progress: false` for the same reason - a cancelled run here
# means a branch left holding half of a regeneration.
concurrency:
  group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
  queue: max
  cancel-in-progress: false

permissions: { }

jobs:
  # `render` and `render-commit` are two halves, and the split is the security boundary of this
  # workflow.
  #
  # `render` builds the pull request's code: the `just` recipes it calls run
  # `cargo` under the toolchain `rust-toolchain.toml` names, with every build script and proc
  # macro in the graph. So it holds no secret and a read-only `GITHUB_TOKEN`, and hands on only
  # data: what it regenerated, as a patch artifact.
  #
  # `render-commit` holds the maintenance App's private key and the write token minted from it,
  # and runs nothing from the checkout: it checks the patch against the files this workflow
  # generates and commits it. Were both halves one job, anything `render` ran could read the key
  # out of the runner's memory or leave a process behind to collect the token once it was minted
  # - a compromised crate arriving in a Renovate pull request would be enough.
  render:
    name: Render
    # Forks get no secrets, so the commit could not be pushed to their branch anyway. `verify`
    # below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code; the write happens in `render-commit`
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request's head commit, not the merge commit: the render has to read the
      # `Cargo.toml` and the structs the pull request proposes. Pinned to the event's SHA rather
      # than the branch name, because `render-commit` applies the patch to that SHA and no other;
      # a branch that moved in between would only have its patch skipped, and the push that moved
      # it runs this workflow again.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # `just` rather than a script under `.github/scripts/`, so that the command a README
      # quotes, the command CI runs and the command a developer types are one string.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      # `just regenerate` minus `dockerfile-labels`: the Dockerfile is never written here (see
      # `Hand the regenerated files on`).
      - name: Regenerate everything the configuration types own
        run: just contract-json tables toml-example

      # The two pinned dependency tags, straight out of `Cargo.toml`. They are the only scalars
      # this repository still has to produce itself: the name, the description, the licence, the
      # release tag, the edition and the documentation index are all derived from the manifest
      # and from `docs/` by the action below, and merged with these.
      - name: Generate the dependency-tag payload
        id: config
        run: |
          set -euo pipefail
          json="$(just docs-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` is pinned rather than left to its default. That default is `github.ref_name`,
      # which on a `pull_request` event is `<number>/merge`, so `render` would write that into
      # every badge and permanent link while `verify` on `main` wrote `main` - a drift failure on
      # the merge commit with nothing in the diff to explain it.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@421289db958b620e2772ba46d11d014bf25a371b # tag=actions-common-readme-variables-v2.1.0
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Rendered into the working tree only; `render-commit` commits them. The partials both
      # templates read live under `target/`, which the patch below does not reach.
      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}

      - name: Render the configuration reference
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}

      # The four files this workflow owns, and nothing else: a dirty working tree must not ride
      # along in a documentation commit.
      #
      # The contract is here rather than behind a `git diff` gate because it carries the version
      # out of `Cargo.toml`, and a release pull request bumps that without regenerating anything.
      # A gate turned every release into a red check that the release bot could not clear on its
      # own; regenerating and committing it puts the new version on the same branch that raised
      # it, and a configuration change still arrives as a reviewable diff in the pull request
      # that caused it. `verify` below is what keeps that true where nothing can be committed.
      #
      # The Dockerfile is not, as in TankoVault and discord-alertmanager. Its `terrace-config:labels`
      # region holds three constants that move only with a deliberate prefix change, and a bot
      # editing the build recipe is a change nobody reviewed. `Config Contract` reports a drift,
      # and `just regenerate` locally is the fix.
      - name: Hand the regenerated files on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
        with:
          artifact_name: docs-render
          paths: README.md docs/CONFIGURATION.md config.example.toml docs/config.contract.json

      - name: Summarise
        env:
          HAS_CHANGES: ${{ steps.patch.outputs.has_changes }}
        run: |
          set -euo pipefail
          if [ "${HAS_CHANGES}" = "true" ]; then
            {
              echo "Regenerated, for \`Commit Render\` to commit:"
              git status --porcelain -- README.md docs/CONFIGURATION.md config.example.toml docs/config.contract.json \
                | sed 's/^.. /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Every generated file already matched its source." >> "$GITHUB_STEP_SUMMARY"
          fi

  render-commit:
    name: Commit Render
    needs: render
    if: >-
      github.event_name == 'pull_request' && needs.render.outputs.has_changes == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Where ACTIONS_MAINTENANCE_APP_ID and ACTIONS_MAINTENANCE_PRIVATE_KEY live. Only this job,
    # which runs no repository code, gets it.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch the commit the patch applies to; the write uses the App token
    steps:
      # Blocking, not auditing: nothing here needs more than GitHub's own endpoints - the
      # checkout, the token, the artifact download and the commit.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # An App installation token, so the commit is verified and - unlike one made with
      # `GITHUB_TOKEN` - re-triggers the checks on the branch it lands on. Scoped to the one
      # permission the commit needs.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to commit the regenerated files

      # `artifact_name` is spelled out rather than read from the render job's output, which a job
      # running pull request code produced. `allowed_paths` is exactly the four files `render`
      # regenerates; any other path fails this job and nothing is committed.
      - name: Commit the regenerated files
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: docs-render
          allowed_paths: 'README.md docs/CONFIGURATION.md config.example.toml docs/config.contract.json'
          commit_message: 'docs: regenerate the documentation and the config contract'

  verify:
    name: Docs are current
    # The complement of `render`: it covers the pushes to `main` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Regenerate everything the configuration types own
        run: just regenerate

      # The two pinned dependency tags, straight out of `Cargo.toml`. They are the only scalars
      # this repository still has to produce itself: the name, the description, the licence, the
      # release tag, the edition and the documentation index are all derived from the manifest
      # and from `docs/` by the action below, and merged with these.
      - name: Generate the dependency-tag payload
        id: config
        run: |
          set -euo pipefail
          json="$(just docs-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` is pinned rather than left to its default. That default is `github.ref_name`,
      # which on a `pull_request` event is `<number>/merge`, so `render` would write that into
      # every badge and permanent link while `verify` on `main` wrote `main` - a drift failure on
      # the merge commit with nothing in the diff to explain it.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@421289db958b620e2772ba46d11d014bf25a371b # tag=actions-common-readme-variables-v2.1.0
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when the committed file is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify docs/CONFIGURATION.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      # `just regenerate` wrote over all three committed copies in the step above, so the diff
      # is the check. All at once rather than one step each: a branch that regenerated none of
      # them should be told about all three rather than about whichever came first.
      #
      # Not the `config-contract` action, although it would check two of these: it does not
      # know about `config.example.toml`, so this job would still need the diff and would then
      # be reporting the same drift from two places.
      - name: Verify config.example.toml, the contract and the LABEL region are current
        run: git diff --exit-code -- config.example.toml docs/config.contract.json Dockerfile
