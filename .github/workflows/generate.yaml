name: Generate

# Every file a tool writes rather than a person. Each generator job runs on the pull request's head
# and uploads a patch; the Generated Files job is a required check and fails while a patch is not
# committed yet or a generator failed.
# generate-commit.yaml, a workflow_run workflow the pull request cannot edit, commits the merged
# patch to the branch, and the run on that commit decides.
#
# Both generators run the pull request's code, so they hold no secret and no write permission and
# hand on only a patch. The reverse gates stay in build.yaml and the docs workflow, which run on
# every event and therefore also cover the default branch and forks.
#
# No `paths` filter: the Generated Files check has to report on every pull request to be required.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  # `cargo fmt` honours the pull request's own `rust-toolchain.toml` and `rustfmt.toml`, so this
  # job runs code the pull request chose: it holds no secret and hands on only a patch.
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
    outputs:
      has_changes: ${{ steps.format.outputs.changes_detected }}
      artifact_name: ${{ steps.format.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-rust-auto-format-v2.0.3
        with:
          artifact_name: rust-auto-format

  # `render` and generate-commit.yaml (a workflow_run workflow the pull request cannot
  # edit) are two halves, and the split is the security boundary of this workflow.
  #
  # `render` builds the pull request's code: the `just` recipes it calls run
  # `cargo` under the toolchain `rust-toolchain.toml` names, with every build script and proc
  # macro in the graph. So it holds no secret and a read-only `GITHUB_TOKEN`, and hands on only
  # data: what it regenerated, as a patch artifact.
  #
  # generate-commit.yaml holds the maintenance App's private key and the write token
  # minted from it, and runs nothing from the checkout: it checks the patch against the files this
  # workflow generates and commits it. Were both halves one job, anything `render` ran could read
  # the key out of the runner's memory or leave a process behind to collect the token once it was
  # minted
  # - a compromised crate arriving in a Renovate pull request would be enough.
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code; the write happens in generate-commit.yaml
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The pull request's head commit, not the merge commit: the render has to read the
      # `Cargo.toml` and the structs the pull request proposes. Pinned to the event's SHA rather
      # than the branch name, because generate-commit.yaml applies the patch to that
      # SHA and no other; a branch that moved in between would only have its patch skipped, and the
      # push that moved it runs this workflow again.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # `just` rather than a script under `.github/scripts/`, so that the command a README
      # quotes, the command CI runs and the command a developer types are one string.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      # `just regenerate` minus `dockerfile-labels`: the Dockerfile is never written here (see
      # `Hand the regenerated files on`).
      - name: Regenerate everything the configuration types own
        run: just contract-json tables toml-example

      # The two pinned dependency tags, straight out of `Cargo.toml`. They are the only scalars
      # this repository still has to produce itself: the name, the description, the licence, the
      # release tag, the edition and the documentation index are all derived from the manifest
      # and from `docs/` by the action below, and merged with these.
      - name: Generate the dependency-tag payload
        id: config
        run: |
          set -euo pipefail
          json="$(just docs-variables)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # `branch` is pinned rather than left to its default. That default is `github.ref_name`,
      # which on a `pull_request` event is `<number>/merge`, so `render` would write that into
      # every badge and permanent link while `verify` on `main` wrote `main` - a drift failure on
      # the merge commit with nothing in the diff to explain it.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Rendered into the working tree only; generate-commit.yaml commits them. The
      # partials both templates read live under `target/`, which the patch below does not reach.
      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}

      - name: Render the configuration reference
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/CONFIGURATION.md.hbs
          output: docs/CONFIGURATION.md
          partials-dir: target/config-docs
          variables: ${{ steps.variables.outputs.variables }}

      # The four files this workflow owns, and nothing else: a dirty working tree must not ride
      # along in a documentation commit.
      #
      # The contract is here rather than behind a `git diff` gate because it carries the version
      # out of `Cargo.toml`, and a release pull request bumps that without regenerating anything.
      # A gate turned every release into a red check that the release bot could not clear on its
      # own; regenerating and committing it puts the new version on the same branch that raised
      # it, and a configuration change still arrives as a reviewable diff in the pull request
      # that caused it. `verify` below is what keeps that true where nothing can be committed.
      #
      # The Dockerfile is not, as in TankoVault and discord-alertmanager. Its `terrace-config:labels`
      # region holds three constants that move only with a deliberate prefix change, and a bot
      # editing the build recipe is a change nobody reviewed. `Config Contract` reports a drift,
      # and `just regenerate` locally is the fix.
      - name: Hand the regenerated files on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-patch-v2.0.1
        with:
          artifact_name: docs-render
          paths: README.md docs/CONFIGURATION.md config.example.toml docs/config.contract.json

      - name: Summarise
        env:
          HAS_CHANGES: ${{ steps.patch.outputs.has_changes }}
        run: |
          set -euo pipefail
          if [ "${HAS_CHANGES}" = "true" ]; then
            {
              echo "Regenerated, for \`Commit Generated Files\` to commit:"
              git status --porcelain -- README.md docs/CONFIGURATION.md config.example.toml docs/config.contract.json \
                | sed 's/^.. /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Every generated file already matched its source." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The lock-file sync comes in two halves, and the split is the security boundary of this
  # workflow.
  #
  # `cargo fetch` runs code the pull request controls: the toolchain `rust-toolchain.toml` names,
  # and whatever that toolchain's cargo does with the manifests. So the half that runs it holds no
  # secret and a read-only `GITHUB_TOKEN`, and hands on only data: the changed `Cargo.lock`, as a
  # patch artifact.
  #
  # The second half, generate-commit.yaml, runs from the default branch's copy and holds the
  # maintenance App's private key and the write token minted from it, and runs nothing from the
  # checkout: commit-patch refuses any path outside its allowlist. Were both halves one job, anything the first ran could read the key out
  # of the runner's memory or leave a process behind to collect the token once it was minted - a
  # compromised toolchain or crate arriving in a Renovate pull request would be enough.
  generate-lock-file:
    name: Sync Cargo.lock with Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The pull request head commit, not the merge commit and not the branch name: the patch is
      # committed to the branch, and generate-commit.yaml (a workflow_run
      # workflow the pull request cannot edit) applies it to exactly this commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Sync Cargo.lock with Cargo.toml
        run: cargo fetch

      - name: Hand the lock file on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-patch-v2.0.1
        with:
          artifact_name: cargo-lock
          paths: Cargo.lock

  # `apps/frontend/package-lock.json`, which the Dockerfile installs with `npm ci`. That refuses a
  # lockfile which disagrees with `package.json`, and Renovate can push exactly that: its npm 12
  # fails the lockfile refresh with `EALLOWREMOTE` on any package that bundles dependencies, which
  # `@tailwindcss/oxide-wasm32-wasi` does since 4.3.4, and it then pushes `package.json` alone.
  #
  # `--package-lock-only` resolves and rewrites without installing or running anything, and is
  # byte-identical on a lockfile already in step, so a pull request that did not touch
  # `package.json` produces no commit.
  generate-npm-lock-file:
    name: Sync package-lock.json with package.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # `--allow-remote=all` because npm 12 defaults it to `none` and reads a bundling package by
      # its `resolved` tarball URL, which it classes as remote even on the registry host. That
      # widens what may be resolved, so every `resolved` URL is then held to the npm registry: a
      # tarball URL anywhere in the result fails here instead of reaching the patch.
      - name: Sync package-lock.json with package.json
        working-directory: apps/frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --allow-remote=all
          node -e '
            const { packages } = require("./package-lock.json");
            const off = Object.entries(packages)
              .filter(([path, pkg]) => path && pkg.resolved && !pkg.resolved.startsWith("https://registry.npmjs.org/"))
              .map(([path, pkg]) => path + ": " + pkg.resolved);
            if (off.length) {
              console.error("::error::package-lock.json resolves outside the npm registry:\n" + off.join("\n"));
              process.exit(1);
            }
          '

      - name: Hand the lock file on
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-patch-v2.0.1
        with:
          artifact_name: npm-lock
          paths: apps/frontend/package-lock.json


  # The required check. It needs every generator above and runs whatever their result, so it
  # reports on every pull request.
  verdict:
    name: Generated Files
    needs: [ fmt, render, generate-lock-file, generate-npm-lock-file ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the commit the merged patch is made from
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Generated Files Verdict
        uses: TimSchoenle/actions/actions/common/generated-files-verdict@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-generated-files-verdict-v1.2.3
        with:
          needs: ${{ toJSON(needs) }}
