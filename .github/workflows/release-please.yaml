name: release-please
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: { }

env:
  DOCKER_REPO: timschoenle/mp-stats-legacy-viewer
  HELM_REPO: TimSchoenle/helm-charts
  CHART_PATH: charts/mp-stats-legacy-viewer

jobs:
  release-please:
    name: Release Please
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to create release commits and tags
      issues: write # Required to create release issues
      pull-requests: write # Required to create release PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # Scoped to what release-please does with it: the release commit and tag, the release pull
      # request, and the labels it puts on that pull request through the issues API. Without these
      # the token inherits every permission the App's installation holds.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.generate_token.outputs.token }}

  docker-release:
    name: Docker Release
    environment:
      name: publish
      deployment: false
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required for OIDC authentication with Cosign
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the version `TimSchoenle/helm-charts` verifies with, so a
      # signature this job mints and the check that reads it are never one
      # client release apart. The pin lives in that repository's `justfile`.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # No QEMU setup on purpose: the Dockerfile cross-compiles every artifact
      # from the runner's native architecture. Should a target-architecture
      # command ever sneak into the build, it must fail loudly rather than fall
      # back to (very slow) emulation.
      #
      # `cache-binary: false`: this job publishes, so it restores nothing from the Actions cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No `cache-from`: the Actions cache is writable from any branch's build,
          # so the published image is built from source alone.
          build-args: |
            version=${{ needs.release-please.outputs.tag_name }}
            release=${{ needs.release-please.outputs.tag_name }}
            vendor=Tim Schönle
            VERSION=${{ needs.release-please.outputs.tag_name }}

      - name: Sign the images with GitHub OIDC Token
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          # `--recursive` also signs the per-architecture images referenced by
          # the multi-arch manifest list, not just the list itself.
          cosign sign --yes --recursive "${images[@]}"

      # ── the configuration contract ──────────────────────────────────────────
      # Everything below publishes the document that lets `TimSchoenle/helm-charts`
      # check a rendered `config.toml` against what this image actually loads. The
      # order is the whole design: the labels are verified against the image that
      # was really built, and only then is anything attached or signed.

      # The bytes the builder stage generated, on the runner. One export of the
      # `contract-export` stage rather than a second full build - everything it
      # needs is already in the builder's local cache from the push above - and the same
      # bytes the runtime stage COPYed to `/config/contract.json`.
      - name: Export the generated contract and labels
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: contract-export
          outputs: type=local,dest=contract-out
          build-args: |
            version=${{ needs.release-please.outputs.tag_name }}
            release=${{ needs.release-please.outputs.tag_name }}
            vendor=Tim Schönle
            VERSION=${{ needs.release-please.outputs.tag_name }}

      # Pinned to what the consuming repository pins, so the two halves of the
      # protocol are exercised by the same client: `TimSchoenle/helm-charts`
      # carries `oras_version` in its `justfile` and installs it exactly this way.
      - name: Install oras
        env:
          ORAS_VERSION: '1.3.3'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version

      # For `terrace-contract image attach` below. It shells out to the `oras`
      # installed above, hence `oras: 'false'`. The action also installs its own
      # cosign, at the same release the step further up pins.
      - name: Install terrace-contract
        uses: TimSchoenle/actions/actions/terrace/setup@54a4dc05fd351a9bf9e9638fa3ebbc572b5f2d7f # tag=actions-terrace-setup-v4.0.3
        with:
          version: '0.14.1'
          oras: 'false'

      # The checkpoint the whole scheme rests on, and the reason the `LABEL` block
      # in the Dockerfile is allowed to be hand-written. It reads the pushed index
      # the way the chart repository will: every platform manifest under it, each
      # one's own config blob, `.config.Labels`. Labels live per manifest, so a
      # differing base or a per-platform build argument can leave one architecture
      # carrying them and another not - and only reading both can see that.
      #
      # The floating tag is briefly unverified here. That is acceptable because
      # charts pin digests and nothing is attached or signed until this passes.
      - name: Verify every platform carries the contract labels
        env:
          IMAGE: docker.io/${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # `.manifests` is absent when the pushed digest is a single manifest
          # rather than an index; `unknown/unknown` are the provenance and SBOM
          # attestations, which are not images and carry none of this.
          platforms="$(bash .github/scripts/retry-registry-read.sh \
            oras manifest fetch "${IMAGE}@${DIGEST}" \
            | jq -r '(.manifests // [])[] | select((.platform.os // "unknown") != "unknown")
                     | "\(.digest) \(.platform.os)/\(.platform.architecture)"')"
          if [ -z "${platforms}" ]; then
            platforms="${DIGEST} the-pushed-manifest"
          fi

          status=0
          while read -r manifest platform; do
            [ -n "${manifest}" ] || continue
            bash .github/scripts/retry-registry-read.sh \
              oras manifest fetch-config "${IMAGE}@${manifest}" \
              | jq -c '.config.Labels' > "${RUNNER_TEMP}/labels.json"
            bash .github/scripts/check-image-labels.sh \
              "${RUNNER_TEMP}/labels.json" contract-out/out/contract.labels \
              "${IMAGE}@${DIGEST} (${platform})" || status=1
          done <<< "${platforms}"
          exit "${status}"

      # Attached to the digest, never to a tag: a tag can be moved, and the
      # referrer subject is what ties the document to the exact build a chart
      # pins. Verbatim bytes - the ones the generator wrote, with nothing added
      # afterwards - because the attachment *is* the tie and there is no digest
      # field to fill in.
      #
      # Idempotent. `terrace-contract image attach` looks first: a referrer of this
      # type with byte-identical content is reused and its digest printed, with
      # nothing attached; a referrer with different content fails the step, since
      # one digest must never carry two contracts; otherwise it attaches and prints
      # the new referrer's digest. A re-run - the build is reproducible, so it
      # pushes the same digest - therefore never leaves a second referrer of the
      # same artifact type, which the chart repository refuses rather than picks
      # between.
      #
      # Signed from `release-please.yaml` on `refs/heads/main`, which is the
      # workflow identity the chart repository's `contract_signer` regexp admits.
      # Moving this step to another workflow or another ref breaks the vendoring
      # step over there with a signature error nobody would connect to it.
      #
      # It signs exactly the digest the attach printed, so there is no
      # `oras discover` poll: Docker Hub's referrers index is eventually
      # consistent, and reading it back right after attaching could return an
      # empty index or only an older referrer, signing the wrong one.
      - name: Attach and sign the contract
        env:
          IMAGE: docker.io/${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          referrer="$(terrace-contract image attach contract-out/out/contract.json \
            --image "${IMAGE}@${DIGEST}")"
          if ! [[ "${referrer}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::terrace-contract image attach printed '${referrer}', not a referrer digest" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${referrer}"

  helm-release:
    name: Helm Release
    environment:
      name: ci
      deployment: false
    needs: [ release-please, docker-release ]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: TimSchoenle/actions/actions/helm/update-chart-version@0b3967d3d992d12aa88da1f8facf412b162d5ab2 # tag=actions-helm-update-chart-version-v1.8.1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.HELM_REPO }}
          chart-path: ${{ env.CHART_PATH }}
          images: |
            {
              "image.tag": {
                "tag": "${{ needs.release-please.outputs.tag_name }}",
                "digest": "${{ needs.docker-release.outputs.image_digest }}"
              }
            }
          app-version: ${{ needs.release-please.outputs.tag_name }}