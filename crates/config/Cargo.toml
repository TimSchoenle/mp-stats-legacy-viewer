[package]
name = "mp-stats-config"
version = "0.14.1"
edition.workspace = true
# Workspace-internal: the typed configuration surface of this repository, not a
# reusable library.
publish = false

[dependencies]
serde = { workspace = true }
# The layering itself. `loader` only: the reload supervisor would link notify and
# tokio-util into every consumer of a config struct, and nothing here is rotated
# while the process runs - the server serves files off disk, the converter is a
# one-shot batch job.
terrace-config = { workspace = true }

[dev-dependencies]
# `figment::Jail` sets and restores `MP_STATS_*` and moves into a scratch
# directory, which is how the dialect tests avoid `env::set_var`. The same
# figment `terrace-config` resolves, plus its `test` feature.
figment = { workspace = true, features = ["test"] }
