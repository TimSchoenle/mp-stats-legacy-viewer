<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <!-- `dx` substitutes the `[web.app] title` from `Dioxus.toml` here. The placeholder has to be
         present: given a `<title>` without it, `dx` inserts the configured title *before* the
         closing tag rather than replacing what is there, and the page ends up titled twice. -->
    <title>{app_title}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- The compiled stylesheet, and the fonts it declares `@font-face` rules for. Both are built
         by `npm run build:assets` into `public/`, which `dx` copies into the root of the output
         with its relative paths and no content hash - so these two URLs are stable and the rules
         inside app.css can go on naming `/fonts/…` unchanged.

         The stylesheet is linked rather than inlined, so it is cached once instead of riding on
         every document the server sends - and it needs nothing from the `Content-Security-Policy`
         beyond the `'self'` that is already there. -->
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="stylesheet" href="/app.css"/>
</head>

<body>
    <!-- `dioxus-web` mounts here: the id is `main` because that is the root element name
         `dioxus_web::Config` defaults to. Renaming it mounts the app on `<body>` instead, with a
         console warning as the only sign. -->
    <div id="main"></div>

    <!-- `dx` appends the module script that boots the wasm bundle just before this tag closes. It
         is not written out here because its URL carries a content hash that only the build
         knows. -->
</body>

</html>
