[workspace.package]
edition = "2024"

# The root package holds no code - `src/lib.rs` is a placeholder release-please needs a version
# on - but it is the manifest `actions/common/readme-variables` reads, so every field the README
# quotes lives here. `edition` is spelled out rather than inherited: the reader takes a
# field value and treats `edition.workspace = true` as an absence, and the compatibility table
# has to come from the payload rather than from a number typed into the template.
[package]
name = "mp-stats-platform"
version = "0.17.2"
description = "Historical Minecraft server statistics, converted to sharded binary chunks and queried in the browser by a Yew client."
license = "MIT"
edition = "2024"
publish = false

[workspace]
members = [
    "crates/core",
    "crates/common",
    "crates/config",
    "apps/frontend",
    "apps/server",
    "apps/converter",
]
resolver = "2"

[profile.dev]
incremental = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smol_str = { version = "0.3.5", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }
anyhow = "1.0.102"
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
gloo-net = "0.7.0"
gloo-console = "0.4.0"
wasm-bindgen = "0.2.110"
wasm-bindgen-futures = "0.4.60"
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
walkdir = "2.5.0"
rayon = "1.11.0"
web-sys = { version = "0.3.87", features = ["HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Window", "Document", "console"] }
lzma-rust2 = "0.19.0"
binary-layout = "4.0.2"
tar = "0.4.44"
thiserror = "2.0.18"
futures = "0.3.31"
gloo-timers = "0.4.0"
# Pinned by tag, not branch: `Cargo.lock` records the resolved revision either way, but a branch
# dependency lets `cargo update` move silently across arbitrary commits, whereas a tag makes every
# bump a deliberate manifest edit that shows up in review.
#
# `default-features = false` drops `reload`: nothing here is rotated while the process runs, so
# the server would link notify, tokio-util and tracing for a supervisor it never starts. What is
# taken on top of `loader` is `explain`, which costs no dependency at all and is what answers
# "which of the five layers supplied this value" without a debugger. `schema` is *not* here - it
# is a documentation-time cost, taken by `mp-stats-config`'s own `config-schema` feature.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.9.0", default-features = false, features = ["loader", "explain"] }
# Pinned by tag for the same reason as `terrace-config` above. The `cloudflare` feature is
# `presets` and `nonce` together: the origin tables the Cloudflare products load from, and the
# per-response nonce slot the edge-injected ones need.
csp-shell = { git = "https://github.com/TimSchoenle/csp-shell", tag = "csp-shell-v0.2.0", features = ["cloudflare"] }

# Internal crates
mp-stats-core = { path = "crates/core" }
mp-stats-common = { path = "crates/common" }
mp-stats-config = { path = "crates/config" }
