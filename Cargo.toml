[workspace.package]
edition = "2024"

# The root package holds no code - `src/lib.rs` is a placeholder release-please needs a version
# on - but it is the manifest `actions/common/readme-variables` reads, so every field the README
# quotes lives here. `edition` is spelled out rather than inherited: the reader takes a
# field value and treats `edition.workspace = true` as an absence, and the compatibility table
# has to come from the payload rather than from a number typed into the template.
[package]
name = "mp-stats-platform"
version = "0.18.0"
description = "Historical Minecraft server statistics, converted to sharded binary chunks and queried in the browser by a Dioxus client."
license = "MIT"
edition = "2024"
publish = false

[workspace]
members = [
    "crates/core",
    "crates/common",
    "crates/config",
    "apps/frontend",
    "apps/server",
    "apps/converter",
]
resolver = "2"

[profile.dev]
incremental = false

# The profile `dx` builds the web bundle under. It invents this one itself - inheriting `release`
# and lowering `opt-level` - unless the workspace defines it, which is what this block is for:
# `strip` is the key that has to be set here and cannot be set anywhere else.
#
# `dx` leaves DWARF in a release wasm on purpose, because it means to hand the stripping to
# wasm-opt. binaryen 129 does not survive the attempt - it aborts reading the debug sections with
# "compile unit size was incorrect", on Linux and Windows alike - and `dx` treats that as
# non-fatal, so the build goes on and quietly bundles the *unoptimized* module. Stripping at link
# time instead leaves wasm-opt nothing to trip over, and is what keeps the shipped bundle near a
# megabyte rather than two and a half.
#
# `opt-level` is restated because defining this profile at all is what stops `dx` from supplying
# its own value for it - which is `s`. `z` is taken instead, and measured rather than assumed: it
# is worth 70 KB of the 930 KB `s` produces here, and nothing in this client is hot enough to pay
# for the difference. wasm-opt is asked for `z` as well; see `apps/frontend/Dioxus.toml`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"

# The documentation gate, declared once and inherited by every member through `[lints] workspace =
# true`, so the converter cannot be held to a looser standard than the crate whose format it
# writes. `missing_docs` is what the `doc` job in `build.yaml` turns into an error: rustdoc runs
# rustc's lints, and `RUSTDOCFLAGS: -D warnings` is what makes an undocumented `pub` item fail the
# merge rather than scroll past in a log.
#
# `clippy::missing_docs_in_private_items` is deliberately absent. A private helper whose body is
# six obvious lines has nothing to say; the private constant whose value came out of a page size
# has everything to say, and no lint tells those apart.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# `pedantic` is deliberately not taken here. It is not part of the documentation gate, and turning
# it on in this repository reports 102 findings that have nothing to do with doc comments. The two
# lints below live inside `pedantic` and are named individually, which enables them without it.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# An identifier written outside backticks renders as prose and then cannot be searched for.
doc_markdown = "warn"
# The missing blank line after the summary, which makes the whole comment the index entry.
too_long_first_doc_paragraph = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"
doc_include_without_cfg = "warn"

[workspace.lints.rustdoc]
# Denied rather than warned: a broken link renders as the literal `[`Foo`]` on the page, so it is
# invisible to the reader and visible only to whoever no longer needs it.
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[lints]
workspace = true

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smol_str = { version = "0.3.5", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }
anyhow = "1.0.102"
# The client framework. `web` selects the WASM renderer `dioxus::launch` dispatches to, and
# `router` pulls in the `Routable` derive that `apps/frontend/src/route.rs` builds every URL from.
# The default features are left on: `launch` is what `dioxus::launch` is, and `devtools` is what
# `dx serve` hot-patches through - both are compiled out of a release build.
dioxus = { version = "0.7.10", features = ["web", "router"] }
gloo-net = "0.7.0"
gloo-console = "0.4.0"
wasm-bindgen = "0.2.110"
wasm-bindgen-futures = "0.4.60"
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
walkdir = "2.5.0"
rayon = "1.11.0"
web-sys = { version = "0.3.87", features = ["HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Window", "Document", "console"] }
lzma-rust2 = "0.19.0"
binary-layout = "4.0.2"
tar = "0.4.44"
thiserror = "2.0.18"
futures = "0.3.31"
gloo-timers = "0.4.0"
# Pinned by tag, not branch: `Cargo.lock` records the resolved revision either way, but a branch
# dependency lets `cargo update` move silently across arbitrary commits, whereas a tag makes every
# bump a deliberate manifest edit that shows up in review.
#
# `default-features = false` drops `reload`: nothing here is rotated while the process runs, so
# the server would link notify, tokio-util and tracing for a supervisor it never starts. What is
# taken on top of `loader` is `explain`, which costs no dependency at all and is what answers
# "which of the five layers supplied this value" without a debugger. `schema` is *not* here - it
# is a documentation-time cost, taken by `mp-stats-config`'s own `config-schema` feature.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.9.0", default-features = false, features = ["loader", "explain"] }
# Pinned by tag for the same reason as `terrace-config` above. The `cloudflare` feature is
# `presets` and `nonce` together: the origin tables the Cloudflare products load from, and the
# per-response nonce slot the edge-injected ones need.
csp-shell = { git = "https://github.com/TimSchoenle/csp-shell", tag = "csp-shell-v0.2.0", features = ["cloudflare"] }
# The record stream both sinks below read. `tracing` rather than `log` because the Sentry
# integration is a `tracing_subscriber::Layer` and because a span is the unit a transaction is
# cut from; `log` records reach it anyway through the `tracing-log` bridge `tracing-subscriber`
# turns on by default.
tracing = "0.1.44"
# `env-filter` is the `RUST_LOG` grammar `telemetry.log_filter` is written in, `json` the
# one-object-per-record layer `telemetry.json_logs` selects, and `fmt` the human-readable one it
# selects instead. Nothing else is taken: the default feature set adds `tracing-log` and
# `smallvec`, both of which are already pulled by the two layers.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "std", "tracing-log"] }
# The Sentry DSN carries a bearer credential for a project's ingest endpoint, and the block
# holding it is logged with `?`. `serde` is the `Deserialize` the loader needs; `Serialize` is
# deliberately not implemented for `SecretString` upstream, which is why the generator serialises
# that one field through a redacting function of its own.
secrecy = { version = "0.10.3", features = ["serde"] }
# The reporter behind `[telemetry.sentry]`, optional at the binary through
# `mp-stats-server/sentry`.
#
# `default-features = false` and then back up one at a time. `backtrace` and `debug-images` are
# what make a stack trace resolve to a source line in a stripped release binary; `panic` is the
# hook that reports a panic, which `axum` otherwise absorbs by dropping the connection and which
# leaves no trace at all in a `scratch` image nobody is attached to. `reqwest`+`rustls` is the
# transport, matching a process that already runs a Tokio reactor and adding no OpenSSL to that
# image. The two integrations are `tracing` for the
# subscriber layer and `tower-axum-matched-path` for one transaction per *matched route* rather
# than per URI - without it every `/data/...` blob is its own transaction name.
#
# `contexts` is deliberately off, and it is a default: it adds an OS/host/runtime tag block by
# pulling `os_info`, whose macOS support carries a fifteen-crate `objc2` tree into `Cargo.lock`
# for a platform no image here targets. What it would report is a constant of the image, which
# the release tag already names.
sentry = { version = "0.49.1", default-features = false, features = [
    "backtrace",
    "debug-images",
    "panic",
    "reqwest",
    "rustls-no-provider",
    "tracing",
    "tower-axum-matched-path",
] }
# The crypto provider for the transport above, chosen here rather than left to a default.
#
# `sentry/rustls` would take reqwest's `rustls`, which pins `aws-lc-rs` - and `aws-lc-sys` builds
# its own C and needs cmake, which the cross-compiling builder in the Dockerfile does not have
# and should not grow for a telemetry client. `rustls-no-provider` leaves the choice open and
# this line makes it `ring`, which is C and assembly the installed cross toolchain already
# compiles.
#
# `default-features = false` because the default *is* the provider that was just declined.
# `std`, `tls12` and `logging` are the rest of what reqwest's connector expects; the process
# default is installed in `apps/server/src/sentry.rs`, since `rustls-no-provider` means nobody
# else does it.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Internal crates
mp-stats-core = { path = "crates/core" }
mp-stats-common = { path = "crates/common" }
mp-stats-config = { path = "crates/config" }
