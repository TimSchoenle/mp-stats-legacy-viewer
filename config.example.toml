# Configuration for a service reading MP_STATS_-prefixed keys.
#
# Generated from the configuration type, so it lists every key that type can carry and nothing
# else. Each key shows the value it already has, commented out: a commented key and a deleted key
# mean the same thing to the loader, so uncomment one only to change it. A key that is not
# commented out has no default, and nothing loads until something supplies it.
#
# Three layers can supply any key below, and all three win over this file: the environment
# variable named above the key, a file named by that variable plus `_FILE`, and a key-named file
# in the secrets directory. A secret belongs in one of those — this file is usually committed.
#
# Read before this file exists:
#
#   MP_STATS_CONFIG — config, default `config.toml`
#     Names the TOML layer: a file, or a directory whose `*.toml` files are all merged in name
#     order.
#
#   MP_STATS_SECRETS_DIR — secrets dir
#     Names a directory of key-named files — a mounted Kubernetes `Secret` volume. Each file
#     supplies the key its name spells.
#
#   MP_STATS_EXPLAIN — reserved
#     Read directly from the environment before the layered config exists, so no file may supply
#     it.

[server]
# Address the HTTP listener binds.
# Type: SocketAddr
# Also from: MP_STATS_SERVER__BIND_ADDR, MP_STATS_SERVER__BIND_ADDR_FILE=/path/to/file,
#   server__bind_addr in the secrets directory
# bind_addr = "0.0.0.0:8080"

# Directory holding the built frontend.
# Type: PathBuf
# Also from: MP_STATS_SERVER__DIST_DIR, MP_STATS_SERVER__DIST_DIR_FILE=/path/to/file,
#   server__dist_dir in the secrets directory
# dist_dir = "dist"

# Directory holding the converter's output, mounted at `/data`.
# Type: PathBuf
# Also from: MP_STATS_SERVER__DATA_DIR, MP_STATS_SERVER__DATA_DIR_FILE=/path/to/file,
#   server__data_dir in the secrets directory
# data_dir = "data"

[server.csp]
# Send the header at all.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__ENABLED, MP_STATS_SERVER__CSP__ENABLED_FILE=/path/to/file,
#   server__csp__enabled in the secrets directory
# enabled = true

[server.csp.cloudflare]
# Reserve a per-response nonce in `script-src`.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__CLOUDFLARE__SCRIPT_NONCE,
#   MP_STATS_SERVER__CSP__CLOUDFLARE__SCRIPT_NONCE_FILE=/path/to/file,
#   server__csp__cloudflare__script_nonce in the secrets directory
# script_nonce = false

# Admit `https://challenges.cloudflare.com` in `script-src` **and** `frame-src`.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__CLOUDFLARE__TURNSTILE,
#   MP_STATS_SERVER__CSP__CLOUDFLARE__TURNSTILE_FILE=/path/to/file,
#   server__csp__cloudflare__turnstile in the secrets directory
# turnstile = false

# Admit Cloudflare Web Analytics: the beacon script, and the endpoint it reports to.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__CLOUDFLARE__WEB_ANALYTICS,
#   MP_STATS_SERVER__CSP__CLOUDFLARE__WEB_ANALYTICS_FILE=/path/to/file,
#   server__csp__cloudflare__web_analytics in the secrets directory
# web_analytics = false

[telemetry]
# `RUST_LOG`-style filter deciding which records are emitted at all, for example `info,mp_stats_server=debug`.
# Type: String
# Also from: MP_STATS_TELEMETRY__LOG_FILTER, MP_STATS_TELEMETRY__LOG_FILTER_FILE=/path/to/file,
#   telemetry__log_filter in the secrets directory
# log_filter = "info"

# Emit one JSON object per record instead of human-readable lines.
# Type: bool
# Also from: MP_STATS_TELEMETRY__JSON_LOGS, MP_STATS_TELEMETRY__JSON_LOGS_FILE=/path/to/file,
#   telemetry__json_logs in the secrets directory
# json_logs = false

[telemetry.sentry]
# Initialise the Sentry client. `false` installs no client, no panic hook, no `tracing` layer and no HTTP middleware, so every other key here is inert and nothing leaves the process.
# Type: bool
# Also from: MP_STATS_TELEMETRY__SENTRY__ENABLED,
#   MP_STATS_TELEMETRY__SENTRY__ENABLED_FILE=/path/to/file, telemetry__sentry__enabled in the
#   secrets directory
# enabled = false

# Ingest URL, `https://<key>@<host>/<project>`.
# Type: SecretString
# Also from: MP_STATS_TELEMETRY__SENTRY__DSN, MP_STATS_TELEMETRY__SENTRY__DSN_FILE=/path/to/file,
#   telemetry__sentry__dsn in the secrets directory
# Secret: the value below is a placeholder.
# dsn = "<secret>"

# Environment tag on every event.
# Type: String
# Also from: MP_STATS_TELEMETRY__SENTRY__ENVIRONMENT,
#   MP_STATS_TELEMETRY__SENTRY__ENVIRONMENT_FILE=/path/to/file, telemetry__sentry__environment in
#   the secrets directory
# Unset by default: the value below is only the shape.
# environment = "<value>"

# Release tag on every event.
# Type: String
# Also from: MP_STATS_TELEMETRY__SENTRY__RELEASE,
#   MP_STATS_TELEMETRY__SENTRY__RELEASE_FILE=/path/to/file, telemetry__sentry__release in the
#   secrets directory
# Unset by default: the value below is only the shape.
# release = "<value>"

# Host tag on every event.
# Type: String
# Also from: MP_STATS_TELEMETRY__SENTRY__SERVER_NAME,
#   MP_STATS_TELEMETRY__SENTRY__SERVER_NAME_FILE=/path/to/file, telemetry__sentry__server_name in
#   the secrets directory
# Unset by default: the value below is only the shape.
# server_name = "<value>"

# Fraction of captured events actually sent, `0.0`–`1.0`.
# Type: f32
# Also from: MP_STATS_TELEMETRY__SENTRY__SAMPLE_RATE,
#   MP_STATS_TELEMETRY__SENTRY__SAMPLE_RATE_FILE=/path/to/file, telemetry__sentry__sample_rate in
#   the secrets directory
# sample_rate = 1.0

# Fraction of traces this process **starts** that are recorded, `0.0`–`1.0`.
# Type: f32
# Also from: MP_STATS_TELEMETRY__SENTRY__TRACES_SAMPLE_RATE,
#   MP_STATS_TELEMETRY__SENTRY__TRACES_SAMPLE_RATE_FILE=/path/to/file,
#   telemetry__sentry__traces_sample_rate in the secrets directory
# traces_sample_rate = 0.0

# Least severe `tracing` level reported as a Sentry **issue**.
# Type: SentryLevel — one of: off, error, warn, info, debug, trace
# Also from: MP_STATS_TELEMETRY__SENTRY__CAPTURE_LEVEL,
#   MP_STATS_TELEMETRY__SENTRY__CAPTURE_LEVEL_FILE=/path/to/file, telemetry__sentry__capture_level
#   in the secrets directory
# capture_level = "error"

# Least severe `tracing` level kept as a **breadcrumb** — the trail attached to the next issue.
# Type: SentryLevel — one of: off, error, warn, info, debug, trace
# Also from: MP_STATS_TELEMETRY__SENTRY__BREADCRUMB_LEVEL,
#   MP_STATS_TELEMETRY__SENTRY__BREADCRUMB_LEVEL_FILE=/path/to/file,
#   telemetry__sentry__breadcrumb_level in the secrets directory
# breadcrumb_level = "info"

# How many breadcrumbs one event carries.
# Type: usize
# Also from: MP_STATS_TELEMETRY__SENTRY__MAX_BREADCRUMBS,
#   MP_STATS_TELEMETRY__SENTRY__MAX_BREADCRUMBS_FILE=/path/to/file,
#   telemetry__sentry__max_breadcrumbs in the secrets directory
# max_breadcrumbs = 100

# Attach a stack trace to events that carry none of their own.
# Type: bool
# Also from: MP_STATS_TELEMETRY__SENTRY__ATTACH_STACKTRACES,
#   MP_STATS_TELEMETRY__SENTRY__ATTACH_STACKTRACES_FILE=/path/to/file,
#   telemetry__sentry__attach_stacktraces in the secrets directory
# attach_stacktraces = true

# Send personally identifying data with every event: the client IP, the full request header set (`Cookie` included) and the resolved user.
# Type: bool
# Also from: MP_STATS_TELEMETRY__SENTRY__SEND_DEFAULT_PII,
#   MP_STATS_TELEMETRY__SENTRY__SEND_DEFAULT_PII_FILE=/path/to/file,
#   telemetry__sentry__send_default_pii in the secrets directory
# send_default_pii = false

# Record request spans: one Sentry transaction per request, named by the *matched route* rather than the URI, so a `/data` path does not become its own transaction name.
# Type: bool
# Also from: MP_STATS_TELEMETRY__SENTRY__HTTP_TRANSACTIONS,
#   MP_STATS_TELEMETRY__SENTRY__HTTP_TRANSACTIONS_FILE=/path/to/file,
#   telemetry__sentry__http_transactions in the secrets directory
# http_transactions = true

# Copy `tracing` span fields onto the Sentry span as attributes.
# Type: bool
# Also from: MP_STATS_TELEMETRY__SENTRY__SPAN_ATTRIBUTES,
#   MP_STATS_TELEMETRY__SENTRY__SPAN_ATTRIBUTES_FILE=/path/to/file,
#   telemetry__sentry__span_attributes in the secrets directory
# span_attributes = false

# How long process exit waits for queued events to drain.
# Type: u64
# Also from: MP_STATS_TELEMETRY__SENTRY__SHUTDOWN_TIMEOUT_SECS,
#   MP_STATS_TELEMETRY__SENTRY__SHUTDOWN_TIMEOUT_SECS_FILE=/path/to/file,
#   telemetry__sentry__shutdown_timeout_secs in the secrets directory
# shutdown_timeout_secs = 2

# Print the SDK's own diagnostics to stderr. For proving a DSN works, not for running.
# Type: bool
# Also from: MP_STATS_TELEMETRY__SENTRY__DEBUG,
#   MP_STATS_TELEMETRY__SENTRY__DEBUG_FILE=/path/to/file, telemetry__sentry__debug in the secrets
#   directory
# debug = false

[converter]
# Directory holding the raw per-edition data dumps. Must exist; the converter refuses to start otherwise.
# Type: PathBuf
# Also from: MP_STATS_CONVERTER__INPUT_DIR, MP_STATS_CONVERTER__INPUT_DIR_FILE=/path/to/file,
#   converter__input_dir in the secrets directory
# input_dir = "data"

# Directory the optimized output is written to. Must differ from the input directory.
# Type: PathBuf
# Also from: MP_STATS_CONVERTER__OUTPUT_DIR, MP_STATS_CONVERTER__OUTPUT_DIR_FILE=/path/to/file,
#   converter__output_dir in the secrets directory
# output_dir = "target/converted_data"

[converter.cache]
# Restore from and store into the cache directory.
# Type: bool
# Also from: MP_STATS_CONVERTER__CACHE__ENABLED,
#   MP_STATS_CONVERTER__CACHE__ENABLED_FILE=/path/to/file, converter__cache__enabled in the
#   secrets directory
# enabled = true

# Where cached output and its input fingerprints live.
# Type: PathBuf
# Also from: MP_STATS_CONVERTER__CACHE__DIR, MP_STATS_CONVERTER__CACHE__DIR_FILE=/path/to/file,
#   converter__cache__dir in the secrets directory
# dir = "target/converter_cache"
