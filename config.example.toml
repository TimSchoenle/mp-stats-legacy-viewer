# Configuration for a service reading MP_STATS_-prefixed keys.
#
# Generated from the configuration type, so it lists every key that type can carry and nothing
# else. Each key shows the value it already has, commented out: a commented key and a deleted key
# mean the same thing to the loader, so uncomment one only to change it. A key that is not
# commented out has no default, and nothing loads until something supplies it.
#
# Three layers can supply any key below, and all three win over this file: the environment
# variable named above the key, a file named by that variable plus `_FILE`, and a key-named file
# in the secrets directory. A secret belongs in one of those — this file is usually committed.
#
# Read before this file exists:
#
#   MP_STATS_CONFIG — config, default `config.toml`
#     Names the TOML layer: a file, or a directory whose `*.toml` files are all merged in name
#     order.
#
#   MP_STATS_SECRETS_DIR — secrets dir
#     Names a directory of key-named files — a mounted Kubernetes `Secret` volume. Each file
#     supplies the key its name spells.
#
#   MP_STATS_EXPLAIN — reserved
#     Read directly from the environment before the layered config exists, so no file may supply
#     it.

[server]
# Address the HTTP listener binds.
# Type: SocketAddr
# Also from: MP_STATS_SERVER__BIND_ADDR, MP_STATS_SERVER__BIND_ADDR_FILE=/path/to/file,
#   server__bind_addr in the secrets directory
# bind_addr = "0.0.0.0:8080"

# Directory holding the built frontend.
# Type: PathBuf
# Also from: MP_STATS_SERVER__DIST_DIR, MP_STATS_SERVER__DIST_DIR_FILE=/path/to/file,
#   server__dist_dir in the secrets directory
# dist_dir = "dist"

# Directory holding the converter's output, mounted at `/data`.
# Type: PathBuf
# Also from: MP_STATS_SERVER__DATA_DIR, MP_STATS_SERVER__DATA_DIR_FILE=/path/to/file,
#   server__data_dir in the secrets directory
# data_dir = "data"

[server.csp]
# Send the header at all.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__ENABLED, MP_STATS_SERVER__CSP__ENABLED_FILE=/path/to/file,
#   server__csp__enabled in the secrets directory
# enabled = true

[server.csp.cloudflare]
# Reserve a per-response nonce in `script-src`.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__CLOUDFLARE__SCRIPT_NONCE,
#   MP_STATS_SERVER__CSP__CLOUDFLARE__SCRIPT_NONCE_FILE=/path/to/file,
#   server__csp__cloudflare__script_nonce in the secrets directory
# script_nonce = false

# Admit `https://challenges.cloudflare.com` in `script-src` **and** `frame-src`.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__CLOUDFLARE__TURNSTILE,
#   MP_STATS_SERVER__CSP__CLOUDFLARE__TURNSTILE_FILE=/path/to/file,
#   server__csp__cloudflare__turnstile in the secrets directory
# turnstile = false

# Admit Cloudflare Web Analytics: the beacon script, and the endpoint it reports to.
# Type: bool
# Also from: MP_STATS_SERVER__CSP__CLOUDFLARE__WEB_ANALYTICS,
#   MP_STATS_SERVER__CSP__CLOUDFLARE__WEB_ANALYTICS_FILE=/path/to/file,
#   server__csp__cloudflare__web_analytics in the secrets directory
# web_analytics = false

[converter]
# Directory holding the raw per-edition data dumps. Must exist; the converter refuses to start otherwise.
# Type: PathBuf
# Also from: MP_STATS_CONVERTER__INPUT_DIR, MP_STATS_CONVERTER__INPUT_DIR_FILE=/path/to/file,
#   converter__input_dir in the secrets directory
# input_dir = "data"

# Directory the optimized output is written to. Must differ from the input directory.
# Type: PathBuf
# Also from: MP_STATS_CONVERTER__OUTPUT_DIR, MP_STATS_CONVERTER__OUTPUT_DIR_FILE=/path/to/file,
#   converter__output_dir in the secrets directory
# output_dir = "target/converted_data"

[converter.cache]
# Restore from and store into the cache directory.
# Type: bool
# Also from: MP_STATS_CONVERTER__CACHE__ENABLED,
#   MP_STATS_CONVERTER__CACHE__ENABLED_FILE=/path/to/file, converter__cache__enabled in the
#   secrets directory
# enabled = true

# Where cached output and its input fingerprints live.
# Type: PathBuf
# Also from: MP_STATS_CONVERTER__CACHE__DIR, MP_STATS_CONVERTER__CACHE__DIR_FILE=/path/to/file,
#   converter__cache__dir in the secrets directory
# dir = "target/converter_cache"
