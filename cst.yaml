schemaVersion: 2.0.0

metadataTest:
  # No arguments: the server reads its layout from the config file below.
  entrypoint: [ "/server" ]
  workdir: ''
  exposedPorts: [ '8080' ]
  user: '1001:1001'
  envVars:
    - key: MP_STATS_CONFIG
      value: /config.toml

fileExistenceTests:
  - name: executable present
    path: /server
    shouldExist: true
  # Without it the server falls back to struct defaults, whose relative paths do not exist in
  # a `scratch` image - so the container would fail to start rather than serve the wrong tree.
  - name: baked configuration present
    path: /config.toml
    shouldExist: true
  # The offline copy of the configuration contract, at the path the image's own
  # `dev.terrace.config.contract.path` label claims it is at. A label pointing at
  # nothing is an image that says it is self-describing and is not.
  - name: configuration contract present
    path: /config/contract.json
    shouldExist: true
  # The shell, at the path `deploy/config.toml` points `server.dist_dir` at. The frontend is
  # copied out of the build tree by a path that only the Dockerfile knows, so a rename on the
  # `dx` side lands here as an empty `/dist` - which the server refuses to start against, but
  # only once the image is already published.
  - name: frontend shell present
    path: /dist/index.html
    shouldExist: true
